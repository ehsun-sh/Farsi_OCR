name: Desktop app (Windows, Linux, macOS)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FarsiOCR-Windows.zip
          - os: ubuntu-22.04
            asset: FarsiOCR-Linux.tar.gz
          - os: macos-latest
            asset: FarsiOCR-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller==6.22.3

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Fetch the Bina model license (OpenMDW-1.1)
        shell: bash
        run: curl -fsSL -o desktop/licenses/Bina-OpenMDW-1.1-LICENSE.txt https://huggingface.co/Reza2kn/Bina-0.4-Koochik-ONNX-INT4/resolve/89e20a65255511bf28442955aad429688083874c/LICENSE

      - name: Build with PyInstaller
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; ORT=onnxruntime-gpu; else SEP=':'; ORT=onnxruntime; fi
          ICON=assets/icon.ico
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -c "from PIL import Image; Image.open('assets/icon.ico').save('icon.icns')"
            ICON=icon.icns
          fi
          pyinstaller --noconfirm --clean --windowed --name FarsiOCR \
            --icon "$ICON" \
            --add-data "assets${SEP}assets" \
            --add-data "licenses${SEP}licenses" \
            --collect-binaries onnxruntime \
            --copy-metadata "$ORT" \
            --osx-bundle-identifier io.github.ehsun-sh.farsiocr \
            --exclude-module tkinter \
            --exclude-module huggingface_hub \
            main.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FarsiOCR\FarsiOCR.exe -ArgumentList '--check', "$PWD\check.txt" -Wait -PassThru
          Get-Content check.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/FarsiOCR.app/Contents/MacOS/FarsiOCR; else EXE=dist/FarsiOCR/FarsiOCR; fi
          "$EXE" --check "$PWD/check.txt"; code=$?
          cat check.txt; exit $code

      - name: Package
        shell: bash
        working-directory: desktop/dist
        run: |
          case "$RUNNER_OS" in
            Windows)
              cp ../licenses/* FarsiOCR/
              7z a -tzip -mx=7 "${{ matrix.asset }}" FarsiOCR > /dev/null ;;
            Linux)
              cp ../licenses/* FarsiOCR/
              tar czf "${{ matrix.asset }}" FarsiOCR ;;
            macOS)
              mkdir -p FarsiOCR.app/Contents/Resources/licenses && cp ../licenses/* FarsiOCR.app/Contents/Resources/licenses/
              ditto -c -k --keepParent FarsiOCR.app "${{ matrix.asset }}" ;;
          esac
          ls -la "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: desktop/dist/${{ matrix.asset }}
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import re;print(re.search(r\"__version__ = '([^']+)'\", open('desktop/farsi_ocr/__init__.py').read())[1])")
          tag="desktop-v$v"
          notes="OCR فارسی با مدل Bina 0.4 Koochik، روی کامپیوتر خودتان.
          Windows: فایل zip را باز کنید و FarsiOCR.exe را اجرا کنید.
          Linux: tar -xzf FarsiOCR-Linux.tar.gz و بعد ./FarsiOCR/FarsiOCR
          macOS (Apple Silicon): zip را باز کنید، FarsiOCR.app را به Applications ببرید و بار اول با راست‌کلیک و Open باز کنید.
          بار اول مدل (حدود ۷۴۰ مگابایت) از Hugging Face دانلود می‌شود. Model: Bina 0.4 Koochik by Reza2kn (OpenMDW-1.1)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "Farsi OCR desktop v$v" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
